
<script type="module">
	import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
	import {
		getDatabase,
		ref,
		onValue
	} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
	import {
		getAuth,
		signInAnonymously
	} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

	const firebaseConfig = {
		apiKey: "AIzaSyDUYeaxBkAqqzuLaiOGT0QdcF242nc1Ka0",
		authDomain: "bicipark-ie-compartir.firebaseapp.com",
		databaseURL: "https://bicipark-ie-compartir-default-rtdb.firebaseio.com",
		projectId: "bicipark-ie-compartir",
		storageBucket: "bicipark-ie-compartir.firebasestorage.app",
		messagingSenderId: "863895230673",
		appId: "1:863895230673:web:63a17d5107f2362e7b4df0"
	};

	const app = initializeApp(firebaseConfig);
	const db = getDatabase(app);
	const auth = getAuth(app);

	signInAnonymously(auth)
		.then(() => {
			console.log("BiciPark conectado y autenticado");

			onValue(ref(db, "ESPACIO 1/ESTADO"), (snapshot) => {
				console.log("Estado del espacio 1:", snapshot.val());
			}, (error) => {
				console.error("Error leyendo estado:", error.message);
			});
		})
		.catch((error) => {
			console.error("Error de autenticación:", error.code, error.message);
		});
</script>
